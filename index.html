<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高雄觀光景點歷年人數地圖</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      color: #1e293b;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f8fafc;
    }
    
    /* 左側邊欄區域 */
    .sidebar {
      width: 340px;
      height: 100vh;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(226, 232, 240, 0.8);
      display: flex;
      flex-direction: column;
      z-index: 1001;
      box-shadow: 4px 0 20px rgba(0,0,0,0.06);
    }

    .sidebar-header {
      padding: 24px 20px 16px 20px;
      border-bottom: 1px solid #f1f5f9;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    }

    .sidebar-header h2 {
      font-size: 1.25rem;
      color: #0f172a;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h2 i {
      color: #0284c7;
    }

    .slider-container {
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type=range] {
      flex: 1;
      cursor: pointer;
      accent-color: #0284c7;
    }
    .year-display {
      font-weight: 800;
      font-size: 1.2rem;
      color: #0284c7;
      min-width: 50px;
    }

    /* 圖例 */
    .legend {
      margin-top: 14px;
      font-size: 0.78rem;
    }
    .legend-title { font-weight: 600; margin-bottom: 6px; color: #64748b; }
    .legend-items { display: flex; justify-content: space-between; gap: 4px; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-color { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* 景點列表清單 */
    .spot-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 8px 12px;
    }

    .spot-item {
      padding: 12px 14px;
      margin-bottom: 6px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      background: #ffffff;
    }

    .spot-item:hover {
      background: #f0f9ff;
      transform: translateX(4px);
      border-color: #bae6fd;
    }

    .spot-item.active {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      border-color: #38bdf8;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15);
      transform: translateX(6px);
    }

    .spot-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spot-rank {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      color: #64748b;
      background: #f1f5f9;
    }

    .rank-1 { background: #fef08a; color: #854d0e; }
    .rank-2 { background: #e2e8f0; color: #334155; }
    .rank-3 { background: #ffedd5; color: #9a3412; }

    .spot-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: #334155;
    }

    .spot-visitors {
      font-size: 0.85rem;
      color: #0284c7;
      font-weight: 700;
    }

    /* 地圖主區域 */
    #map { 
      flex: 1; 
      height: 100vh; 
    }

    /* 呼吸脈衝波紋效果 (動態在地圖上的圓點發光) */
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.7); }
      70% { transform: scale(1.3); box-shadow: 0 0 0 14px rgba(2, 132, 199, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
    }

    /* 右側點擊後的詳細資訊卡片 */
    .detail-card {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      width: 350px;
      max-height: 90vh;
      overflow-y: auto;
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.8);
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .detail-card .close-btn {
      position: absolute;
      top: 16px;
      right: 18px;
      background: #f1f5f9;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 1.1rem;
      color: #64748b;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .detail-card .close-btn:hover { background: #e2e8f0; color: #0f172a; }

    .detail-title { 
      font-size: 1.25rem; 
      font-weight: 800; 
      color: #0f172a; 
      margin-bottom: 14px; 
      padding-right: 32px; 
    }

    .current-stat {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.25);
    }
    .current-stat .label { font-size: 0.85rem; opacity: 0.9; }
    .current-stat .value { font-size: 1.8rem; font-weight: 800; margin-top: 4px; }

    .chart-container {
      margin-top: 12px;
      background: #ffffff;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <!-- 左側邊欄 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2><i class="fa-solid fa-map-location-dot"></i> 高雄景點觀光人次</h2>
      <div class="slider-container">
        <input type="range" id="yearSlider" min="2017" max="2022" step="1" value="2017">
        <span class="year-display" id="yearLabel">2017</span> 年
      </div>

      <div class="legend">
        <div class="legend-title">人數級距說明</div>
        <div class="legend-items">
          <div class="legend-item"><span class="legend-color" style="background:#fdba74"></span> &lt;10萬</div>
          <div class="legend-item"><span class="legend-color" style="background:#f97316"></span> 10萬-100萬</div>
          <div class="legend-item"><span class="legend-color" style="background:#e11d48"></span> &gt;100萬</div>
          <div class="legend-item"><span class="legend-color" style="background:#9ca3af"></span> 無資料</div>
        </div>
      </div>
    </div>

    <!-- 景點清單區塊 -->
    <ul class="spot-list" id="spotList"></ul>
  </div>

  <!-- 地圖容器 -->
  <div id="map"></div>

  <!-- 右側詳細資訊卡片 -->
  <div class="detail-card" id="detailCard">
    <button class="close-btn" onclick="closeDetailCard()"><i class="fa-solid fa-xmark"></i></button>
    <div class="detail-title" id="cardSpotName">景點名稱</div>
    
    <div class="current-stat">
      <div class="label"><span id="cardYear">2017</span> 年造訪總人次</div>
      <div class="value" id="cardVisitors">0 人次</div>
    </div>

    <!-- Chart.js 歷年趨勢圖表 -->
    <div class="chart-container">
      <div style="font-weight: 700; font-size: 0.85rem; color: #475569; margin-bottom: 8px;">
        <i class="fa-solid fa-chart-line"></i> 歷年訪客趨勢圖
      </div>
      <canvas id="historyChart" height="180"></canvas>
    </div>
  </div>

  <!-- CDN 工具庫 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <!-- Chart.js 視覺圖表庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // 1. 景點經緯度
    const COORDINATES = {
      "壽山動物園": [22.6322, 120.2796],
      "旗津風景區": [22.6133, 120.2678],
      "蓮池潭": [22.6828, 120.2975],
      "市立美術館": [22.6565, 120.2862],
      "打狗英國領事館文化園區": [22.6186, 120.2661],
      "高雄市立歷史博物館": [22.6268, 120.2872],
      "國立科學工藝博物館": [22.6410, 120.3228],
      "高雄市文化中心": [22.6256, 120.3175],
      "音樂館": [22.6272, 120.2867],
      "忠烈祠": [22.6247, 120.2736],
      "左營孔廟": [22.6897, 120.2989],
      "駁二藝術特區": [22.6198, 120.2818],
      "陽明高雄海洋探索館": [22.6102, 120.2691],
      "愛河（五福四路至博愛一路）": [22.6244, 120.2922],
      "國家體育場（世運主場館）": [22.7042, 120.2947],
      "美濃客家文物館": [22.8953, 120.5510],
      "澄清湖": [22.6581, 120.3547],
      "佛光山": [22.7538, 120.4439],
      "旗山孔廟": [22.8885, 120.4802],
      "茂林遊憩區": [22.8858, 120.6657],
      "寶來/不老溫泉區": [23.1075, 120.6974],
      "高雄農場": [22.8622, 120.5375],
      "洲仔溼地": [22.6872, 120.2965],
      "援中港溼地": [22.7230, 120.2642],
      "金獅湖風景區": [22.6668, 120.3217],
      "義大世界": [22.7303, 120.4069],
      "月世界": [22.8884, 120.3892],
      "紅毛港文化園區": [22.5539, 120.3308]
    };

    // 2. 初始化地圖
    const map = L.map('map').setView([22.65, 120.35], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let spotsData = [];
    let markersMap = {};
    let currentYear = '2017';
    let selectedSpot = null;
    let historyChart = null;

    const UNIFORM_RADIUS = 10;

    function getColor(visitors) {
      if (!visitors || visitors <= 0) return '#9ca3af'; 
      if (visitors > 1000000) return '#e11d48';         
      if (visitors > 100000)  return '#f97316';         
      return '#fdba74';                                 
    }

    // 選取景點導航
    function selectSpot(spot) {
      selectedSpot = spot;

      map.flyTo([spot.lat, spot.lng], 14, {
        duration: 1.2
      });

      document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
      const activeItem = document.getElementById(`spot-item-${spot.name}`);
      if (activeItem) {
        activeItem.classList.add('active');
        activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      renderDetailCard(spot);
    }

    // 更新 UI 數據與清單
    function updateUI() {
      const spotListEl = document.getElementById('spotList');
      
      const sortedSpots = [...spotsData].sort((a, b) => {
        return (b.history[currentYear] || 0) - (a.history[currentYear] || 0);
      });

      spotListEl.innerHTML = '';

      sortedSpots.forEach((spot, idx) => {
        const count = spot.history[currentYear] || 0;
        const color = getColor(count);

        // 1. 地圖 Marker
        const marker = markersMap[spot.name];
        if (marker) {
          marker.setStyle({
            radius: UNIFORM_RADIUS,
            fillColor: color,
            color: '#ffffff',
            weight: 2,
            fillOpacity: count === 0 ? 0.4 : 0.85
          });
        }

        // 2. 左側清單（含前三名勳章標籤）
        const li = document.createElement('li');
        li.id = `spot-item-${spot.name}`;
        li.className = `spot-item ${selectedSpot && selectedSpot.name === spot.name ? 'active' : ''}`;
        
        let rankBadge = `<span class="spot-rank">${idx + 1}</span>`;
        if (idx === 0) rankBadge = `<span class="spot-rank rank-1"><i class="fa-solid fa-crown"></i></span>`;
        else if (idx === 1) rankBadge = `<span class="spot-rank rank-2">2</span>`;
        else if (idx === 2) rankBadge = `<span class="spot-rank rank-3">3</span>`;

        li.innerHTML = `
          <div class="spot-info">
            ${rankBadge}
            <span class="legend-color" style="background:${color}"></span>
            <span class="spot-name">${spot.name}</span>
          </div>
          <span class="spot-visitors">${count > 0 ? (count/10000).toFixed(1) + ' 萬' : '無數據'}</span>
        `;
        li.onclick = () => selectSpot(spot);
        spotListEl.appendChild(li);
      });

      if (selectedSpot) {
        renderDetailCard(selectedSpot);
      }
    }

    // 數字滾動動畫效果
    function animateValue(obj, start, end, duration) {
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const val = Math.floor(progress * (end - start) + start);
        obj.innerHTML = val > 0 ? `${val.toLocaleString()} 人次` : '無統計數據';
        if (progress < 1) {
          window.requestAnimationFrame(step);
        }
      };
      window.requestAnimationFrame(step);
    }

    // 渲染詳細資訊卡片與圖表
    function renderDetailCard(spot) {
      const count = spot.history[currentYear] || 0;

      document.getElementById('cardSpotName').textContent = spot.name;
      document.getElementById('cardYear').textContent = currentYear;

      // 數字動態計數動畫
      const visitorsEl = document.getElementById('cardVisitors');
      animateValue(visitorsEl, 0, count, 600);

      // 繪製/更新 Chart.js 趨勢圖表
      const years = Object.keys(spot.history).sort();
      const counts = years.map(y => spot.history[y]);

      const ctx = document.getElementById('historyChart').getContext('2d');
      if (historyChart) {
        historyChart.destroy();
      }

      historyChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: years.map(y => y + '年'),
          datasets: [{
            label: '造訪人次',
            data: counts,
            borderColor: '#0284c7',
            backgroundColor: 'rgba(2, 132, 199, 0.1)',
            fill: true,
            tension: 0.3,
            pointRadius: 4,
            pointHoverRadius: 6,
            pointBackgroundColor: '#0284c7'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return value >= 10000 ? (value / 10000) + '萬' : value;
                }
              }
            }
          }
        }
      });

      document.getElementById('detailCard').style.display = 'block';
    }

    function closeDetailCard() {
      document.getElementById('detailCard').style.display = 'none';
      selectedSpot = null;
      document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
    }

    // 3. 解析 data.csv
    Papa.parse('./data.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const rawData = results.data;
        const spotNames = Object.keys(COORDINATES);

        const years = rawData.map(row => String(parseInt(row['年度']))).filter(Boolean);
        if (years.length > 0) {
          const slider = document.getElementById('yearSlider');
          slider.min = Math.min(...years);
          slider.max = Math.max(...years);
          slider.value = slider.min;
          currentYear = String(slider.min);
          document.getElementById('yearLabel').textContent = currentYear;
        }

        spotsData = spotNames.map(name => {
          const coords = COORDINATES[name] || [22.6273, 120.3014];
          const history = {};

          rawData.forEach(row => {
            const year = String(parseInt(row['年度']));
            const count = parseInt(row[name]) || 0;
            history[year] = count;
          });

          return { name, lat: coords[0], lng: coords[1], history };
        });

        // 建立 地圖 Marker
        spotsData.forEach(spot => {
          const marker = L.circleMarker([spot.lat, spot.lng], {
            radius: UNIFORM_RADIUS
          }).addTo(map);

          marker.on('mouseover', function () { this.setStyle({ weight: 4 }); });
          marker.on('mouseout', function () { this.setStyle({ weight: 2 }); });

          marker.on('click', () => {
            selectSpot(spot);
          });

          markersMap[spot.name] = marker;
        });

        updateUI();
      }
    });

    // 年份切換
    document.getElementById('yearSlider').addEventListener('input', (e) => {
      currentYear = e.target.value;
      document.getElementById('yearLabel').textContent = currentYear;
      updateUI();
    });
  </script>
</body>
</html>
