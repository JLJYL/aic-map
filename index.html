<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臺中市消費店家地圖</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    /* 自訂地圖 Popup 樣式與滾動條 */
    .custom-popup .leaflet-popup-content-wrapper {
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .custom-popup .leaflet-popup-content {
      margin: 0;
      width: 280px !important;
    }
    .popup-scroll {
      max-height: 140px;
      overflow-y: auto;
    }
    .popup-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .popup-scroll::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col md:flex-row overflow-hidden font-sans">

  <!-- 側邊欄 / 搜尋與店家列表 -->
  <aside class="w-full md:w-96 bg-white z-20 flex flex-col shadow-lg h-1/2 md:h-full border-r border-slate-200">
    <!-- 標題列 -->
    <div class="p-4 bg-indigo-600 text-white flex items-center justify-between shadow-md">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-store text-2xl text-amber-300"></i>
        <div>
          <h1 class="font-bold text-lg leading-tight">臺中市消費店家地圖</h1>
          <p class="text-xs text-indigo-200">Taichung Shopping & Store Map</p>
        </div>
      </div>
      <button id="reset-view-btn" title="重設地圖視野" class="bg-indigo-500 hover:bg-indigo-400 text-white p-2 rounded-lg transition duration-150">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
    </div>

    <!-- 搜尋框區塊 -->
    <div class="p-4 border-b border-slate-100 bg-slate-50 space-y-3">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="search-input" placeholder="搜尋店家名稱、簡介或關鍵字..." 
               class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
      </div>
      <div class="flex items-center justify-between text-xs text-slate-500 px-1">
        <span>顯示數量：<strong id="store-count" class="text-indigo-600 font-bold">0</strong> / <span id="total-count">0</span> 筆</span>
        <button id="fit-taichung-btn" class="text-indigo-600 hover:underline flex items-center space-x-1">
          <i class="fa-solid fa-expand"></i>
          <span>看全台中</span>
        </button>
      </div>
    </div>

    <!-- 店家清單列表 -->
    <div id="store-list" class="flex-1 overflow-y-auto divide-y divide-slate-100 p-2 space-y-1">
      <div class="p-8 text-center text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i>
        <p class="text-sm">正在讀取店家資料...</p>
      </div>
    </div>

    <!-- 頁尾資訊與備用上傳區 -->
    <div class="p-3 border-t border-slate-200 bg-slate-50 text-xs text-slate-400 flex justify-between items-center">
      <span>資料來源：台中市消費.csv</span>
      <label class="cursor-pointer text-indigo-600 hover:underline">
        手動匯入 CSV
        <input type="file" id="csv-file-input" accept=".csv" class="hidden">
      </label>
    </div>
  </aside>

  <!-- 地圖容器 -->
  <main class="flex-1 h-1/2 md:h-full relative">
    <div id="map" class="w-full h-full z-10"></div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // 初始化地圖 (預設定位於臺中市政府周邊)
    const defaultCenter = [24.16183, 120.64689];
    const defaultZoom = 13;
    const map = L.map('map', { zoomControl: false }).setView(defaultCenter, defaultZoom);

    // 加入 Zoom Control 到右上方
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 加入 OpenStreetMap 圖層
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // 建立地區小組與區以下全面解散的 MarkerClusterGroup
    const markersCluster = L.markerClusterGroup({
      chunkedLoading: true,
      maxClusterRadius: 60,          // 遠看時以「區域/行政區小組」為單位進行分組
      disableClusteringAtZoom: 13,  // 放大到「區」以下（Zoom Level 13 及以上），完全取消聚合，直接顯示所有店家點位
      spiderfyOnMaxZoom: true       // 同一極端重疊座標點擊時蜘蛛網狀散開
    });
    map.addLayer(markersCluster);

    // 全域變數
    let allStores = [];
    let markerMap = new Map();
    let taichungBounds = L.latLngBounds();

    // 載入與解析 CSV 資料
    function loadCSVData(source) {
      Papa.parse(source, {
        download: typeof source === 'string',
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          processStoreData(results.data);
        },
        error: function(err) {
          console.error("CSV 解析失敗：", err);
          alert("無法自動載入 CSV 檔案，請確認同目錄下是否有「台中市消費.csv」或使用手動上傳。");
        }
      });
    }

    // 處理與繪製店家資料
    function processStoreData(data) {
      allStores = [];
      markersCluster.clearLayers();
      markerMap.clear();
      taichungBounds = L.latLngBounds();

      let taichungCount = 0;

      data.forEach((row, index) => {
        // 清理標頭 BOM 與空白鍵
        const cleanRow = {};
        for (let key in row) {
          const cleanKey = key.replace(/^\ufeff/, '').trim();
          cleanRow[cleanKey] = row[key] ? row[key].trim() : '';
        }

        const id = cleanRow['編號'] || index;
        const name = cleanRow['店家名稱標題'] || '未命名店家';
        const lat = parseFloat(cleanRow['緯度']);
        const lng = parseFloat(cleanRow['經度']);
        const phone = cleanRow['電話'] || '無資料';
        const intro = cleanRow['店家簡介'] || '暫無簡介資訊';
        const parking = cleanRow['停車資訊'] || '';

        if (!isNaN(lat) && !isNaN(lng)) {
          const storeObj = { id, name, lat, lng, phone, intro, parking };
          allStores.push(storeObj);

          // 判斷座標是否在台中市合理範圍 (緯度 24.0~24.5, 經度 120.4~121.0)
          const isTaichung = (lat >= 24.0 && lat <= 24.5 && lng >= 120.4 && lng <= 121.0);
          if (isTaichung) {
            taichungBounds.extend([lat, lng]);
            taichungCount++;
          }

          // 建立地圖 Marker 與 Popup
          const popupContent = `
            <div class="bg-indigo-600 text-white p-3">
              <h3 class="font-bold text-base leading-snug">${name}</h3>
            </div>
            <div class="p-3 space-y-2 text-xs text-slate-600">
              <p class="flex items-center space-x-2">
                <i class="fa-solid fa-phone text-indigo-500 w-4"></i>
                <span>${phone !== '無資料' ? `<a href="tel:${phone}" class="text-indigo-600 hover:underline font-semibold">${phone}</a>` : '無電話資訊'}</span>
              </p>
              ${parking ? `
              <p class="flex items-start space-x-2">
                <i class="fa-solid fa-square-parking text-emerald-500 w-4 mt-0.5"></i>
                <span>${parking}</span>
              </p>` : ''}
              <div class="border-t border-slate-100 pt-2 mt-2">
                <p class="font-semibold text-slate-700 mb-1">店家簡介：</p>
                <div class="popup-scroll text-slate-500 leading-relaxed">${intro}</div>
              </div>
            </div>
          `;

          const marker = L.marker([lat, lng]).bindPopup(popupContent, { className: 'custom-popup' });
          markersCluster.addLayer(marker);
          markerMap.set(id, { marker, storeObj });
        }
      });

      // 設定合理的初始視角：如果有台中市店家，自動計算 Bounds 調整；否則使用預設台中市政府視角
      if (taichungCount > 0) {
        map.fitBounds(taichungBounds, { padding: [40, 40] });
      } else {
        map.setView(defaultCenter, defaultZoom);
      }

      // 更新全域總筆數與呈現列表
      document.getElementById('total-count').textContent = allStores.length;
      renderStoreList(allStores);
    }

    // 渲染側邊欄店家列表
    function renderStoreList(stores) {
      const listContainer = document.getElementById('store-list');
      document.getElementById('store-count').textContent = stores.length;

      if (stores.length === 0) {
        listContainer.innerHTML = `
          <div class="p-8 text-center text-slate-400">
            <i class="fa-solid fa-store-slash text-3xl mb-2"></i>
            <p>查無符合關鍵字的店家</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = stores.map(store => `
        <div class="p-3 rounded-lg hover:bg-indigo-50 cursor-pointer transition flex justify-between items-center group" 
             onclick="focusStore('${store.id}')">
          <div class="space-y-1 flex-1 pr-2">
            <h4 class="font-semibold text-sm text-slate-800 group-hover:text-indigo-600 transition">${store.name}</h4>
            <p class="text-xs text-slate-500 flex items-center space-x-1">
              <i class="fa-solid fa-phone text-slate-400"></i>
              <span>${store.phone}</span>
            </p>
          </div>
          <button class="text-slate-300 group-hover:text-indigo-500 p-2">
            <i class="fa-solid fa-location-dot text-base"></i>
          </button>
        </div>
      `).join('');
    }

    // 點擊清單定位店家
    function focusStore(id) {
      const item = markerMap.get(id);
      if (item) {
        const { marker, storeObj } = item;
        markersCluster.zoomToShowLayer(marker, function() {
          map.setView([storeObj.lat, storeObj.lng], 16, { animate: true });
          marker.openPopup();
        });
      }
    }

    // 搜尋過濾功能
    document.getElementById('search-input').addEventListener('input', function(e) {
      const keyword = e.target.value.toLowerCase().trim();
      if (!keyword) {
        renderStoreList(allStores);
        return;
      }

      const filtered = allStores.filter(s => 
        s.name.toLowerCase().includes(keyword) || 
        s.intro.toLowerCase().includes(keyword) || 
        s.phone.includes(keyword)
      );

      renderStoreList(filtered);
    });

    // 重置視角與復原全台中 Bounds
    document.getElementById('reset-view-btn').addEventListener('click', () => {
      if (taichungBounds.isValid()) {
        map.fitBounds(taichungBounds, { padding: [40, 40] });
      } else {
        map.setView(defaultCenter, defaultZoom);
      }
    });

    document.getElementById('fit-taichung-btn').addEventListener('click', () => {
      if (taichungBounds.isValid()) {
        map.fitBounds(taichungBounds, { padding: [40, 40] });
      }
    });

    // 手動選擇 CSV 檔案監聽
    document.getElementById('csv-file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        loadCSVData(file);
      }
    });

    // 頁面初始化：優先讀取同目錄下的「台中市消費.csv」
    window.addEventListener('DOMContentLoaded', () => {
      loadCSVData('./台中市消費.csv');
    });
  </script>
</body>
</html>
