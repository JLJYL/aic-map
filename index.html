<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>高雄觀光景點歷年人數地圖</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      color: #333;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    
    /* 左側邊欄區域 */
    .sidebar {
      width: 320px;
      height: 100vh;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      z-index: 1001;
      box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #f1f5f9;
      background: #f8fafc;
    }

    .sidebar-header h2 {
      font-size: 1.15rem;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type=range] { flex: 1; cursor: pointer; }
    .year-display { font-weight: bold; font-size: 1.1rem; color: #0284c7; min-width: 45px; }

    /* 圖例 */
    .legend {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.75rem;
    }
    .legend-title { font-weight: bold; margin-bottom: 6px; color: #64748b; }
    .legend-items { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-color { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

    /* 景點列表清單 */
    .spot-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }

    .spot-item {
      padding: 12px 20px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .spot-item:hover {
      background: #f0f9ff;
    }

    .spot-item.active {
      background: #e0f2fe;
      border-left: 4px solid #0284c7;
    }

    .spot-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .spot-name {
      font-size: 0.95rem;
      font-weight: 500;
      color: #334155;
    }

    .spot-visitors {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: bold;
    }

    /* 地圖主區域 */
    #map { 
      flex: 1; 
      height: 100vh; 
    }

    /* 右側點擊後的詳細資訊卡片 */
    .detail-card {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.98);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 320px;
      max-height: 85vh;
      overflow-y: auto;
      display: none;
      backdrop-filter: blur(5px);
    }

    .detail-card .close-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.4rem;
      color: #94a3b8;
      cursor: pointer;
    }
    .detail-card .close-btn:hover { color: #334155; }

    .detail-title { font-size: 1.2rem; font-weight: bold; color: #0f172a; margin-bottom: 12px; padding-right: 24px; }

    .current-stat {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }
    .current-stat .label { font-size: 0.85rem; color: #64748b; }
    .current-stat .value { font-size: 1.5rem; font-weight: bold; color: #e11d48; margin-top: 2px; }

    .history-list { list-style: none; margin-top: 8px; }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed #f1f5f9;
      font-size: 0.85rem;
    }
    .history-item.active { font-weight: bold; color: #0284c7; }
  </style>
</head>
<body>

  <!-- 左側邊欄 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>高雄觀光景點歷年人數</h2>
      <div class="slider-container">
        <input type="range" id="yearSlider" min="2017" max="2022" step="1" value="2017">
        <span class="year-display" id="yearLabel">2017</span> 年
      </div>

      <div class="legend">
        <div class="legend-title">人數級距說明</div>
        <div class="legend-items">
          <div class="legend-item"><span class="legend-color" style="background:#fdba74"></span> &lt;10萬</div>
          <div class="legend-item"><span class="legend-color" style="background:#f97316"></span> 10萬-100萬</div>
          <div class="legend-item"><span class="legend-color" style="background:#e11d48"></span> &gt;100萬</div>
          <div class="legend-item"><span class="legend-color" style="background:#9ca3af"></span> 無資料</div>
        </div>
      </div>
    </div>

    <!-- 景點清單區塊 -->
    <ul class="spot-list" id="spotList"></ul>
  </div>

  <!-- 地圖容器 -->
  <div id="map"></div>

  <!-- 右側詳細資訊卡片 -->
  <div class="detail-card" id="detailCard">
    <button class="close-btn" onclick="closeDetailCard()">&times;</button>
    <div class="detail-title" id="cardSpotName">景點名稱</div>
    
    <div class="current-stat">
      <div class="label"><span id="cardYear">2017</span> 年遊客人數</div>
      <div class="value" id="cardVisitors">0 人次</div>
    </div>

    <div style="font-weight: bold; font-size: 0.9rem; color: #475569; margin-bottom: 6px;">歷年數據紀錄</div>
    <ul class="history-list" id="cardHistoryList"></ul>
  </div>

  <!-- CDN 工具庫 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <script>
    // 1. 景點經緯度
    const COORDINATES = {
      "壽山動物園": [22.6322, 120.2796],
      "旗津風景區": [22.6133, 120.2678],
      "蓮池潭": [22.6828, 120.2975],
      "市立美術館": [22.6565, 120.2862],
      "打狗英國領事館文化園區": [22.6186, 120.2661],
      "高雄市立歷史博物館": [22.6268, 120.2872],
      "國立科學工藝博物館": [22.6410, 120.3228],
      "高雄市文化中心": [22.6256, 120.3175],
      "音樂館": [22.6272, 120.2867],
      "忠烈祠": [22.6247, 120.2736],
      "左營孔廟": [22.6897, 120.2989],
      "駁二藝術特區": [22.6198, 120.2818],
      "陽明高雄海洋探索館": [22.6102, 120.2691],
      "愛河（五福四路至博愛一路）": [22.6244, 120.2922],
      "國家體育場（世運主場館）": [22.7042, 120.2947],
      "美濃客家文物館": [22.8953, 120.5510],
      "澄清湖": [22.6581, 120.3547],
      "佛光山": [22.7538, 120.4439],
      "旗山孔廟": [22.8885, 120.4802],
      "茂林遊憩區": [22.8858, 120.6657],
      "寶來/不老溫泉區": [23.1075, 120.6974],
      "高雄農場": [22.8622, 120.5375],
      "洲仔溼地": [22.6872, 120.2965],
      "援中港溼地": [22.7230, 120.2642],
      "金獅湖風景區": [22.6668, 120.3217],
      "義大世界": [22.7303, 120.4069],
      "月世界": [22.8884, 120.3892],
      "紅毛港文化園區": [22.5539, 120.3308]
    };

    // 2. 初始化地圖
    const map = L.map('map').setView([22.65, 120.35], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let spotsData = [];
    let markersMap = {};
    let currentYear = '2017';
    let selectedSpot = null;

    const UNIFORM_RADIUS = 10;

    function getColor(visitors) {
      if (!visitors || visitors <= 0) return '#9ca3af'; // 灰色
      if (visitors > 1000000) return '#e11d48';         // 紅色 >100萬
      if (visitors > 100000)  return '#f97316';         // 橘色 10萬-100萬
      return '#fdba74';                                 // 淺橘 <10萬
    }

    // 選取景點並導航至該位置
    function selectSpot(spot) {
      selectedSpot = spot;

      // 流暢地圖平移並放大
      map.flyTo([spot.lat, spot.lng], 14, {
        duration: 1.2
      });

      // 更新列表 Active 狀態
      document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
      const activeItem = document.getElementById(`spot-item-${spot.name}`);
      if (activeItem) {
        activeItem.classList.add('active');
        activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      renderDetailCard(spot);
    }

    // 更新 Marker 樣式與左側清單數據
    function updateUI() {
      const spotListEl = document.getElementById('spotList');
      
      // 按當前年份人數降冪排序清單
      const sortedSpots = [...spotsData].sort((a, b) => {
        return (b.history[currentYear] || 0) - (a.history[currentYear] || 0);
      });

      spotListEl.innerHTML = '';

      sortedSpots.forEach(spot => {
        const count = spot.history[currentYear] || 0;
        const color = getColor(count);

        // 1. 更新地圖圓點
        const marker = markersMap[spot.name];
        if (marker) {
          marker.setStyle({
            radius: UNIFORM_RADIUS,
            fillColor: color,
            color: '#ffffff',
            weight: 2,
            fillOpacity: count === 0 ? 0.4 : 0.85
          });
        }

        // 2. 渲染側邊欄清單
        const li = document.createElement('li');
        li.id = `spot-item-${spot.name}`;
        li.className = `spot-item ${selectedSpot && selectedSpot.name === spot.name ? 'active' : ''}`;
        li.innerHTML = `
          <div class="spot-info">
            <span class="legend-color" style="background:${color}"></span>
            <span class="spot-name">${spot.name}</span>
          </div>
          <span class="spot-visitors">${count > 0 ? (count/10000).toFixed(1) + ' 萬' : '無數據'}</span>
        `;
        li.onclick = () => selectSpot(spot);
        spotListEl.appendChild(li);
      });

      if (selectedSpot) {
        renderDetailCard(selectedSpot);
      }
    }

    // 渲染詳細卡片
    function renderDetailCard(spot) {
      const count = spot.history[currentYear] || 0;

      document.getElementById('cardSpotName').textContent = spot.name;
      document.getElementById('cardYear').textContent = currentYear;
      document.getElementById('cardVisitors').textContent = count > 0 ? `${count.toLocaleString()} 人次` : '無統計數據 / 暫停開放';

      const historyList = document.getElementById('cardHistoryList');
      historyList.innerHTML = '';
      
      Object.keys(spot.history).sort().reverse().forEach(yr => {
        const yrCount = spot.history[yr];
        const li = document.createElement('li');
        li.className = `history-item ${yr === currentYear ? 'active' : ''}`;
        li.innerHTML = `
          <span>${yr} 年</span>
          <span>${yrCount > 0 ? yrCount.toLocaleString() + ' 人' : '無數據'}</span>
        `;
        historyList.appendChild(li);
      });

      document.getElementById('detailCard').style.display = 'block';
    }

    function closeDetailCard() {
      document.getElementById('detailCard').style.display = 'none';
      selectedSpot = null;
      document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
    }

    // 3. 解析 data.csv
    Papa.parse('./data.csv', {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        const rawData = results.data;
        const spotNames = Object.keys(COORDINATES);

        const years = rawData.map(row => String(parseInt(row['年度']))).filter(Boolean);
        if (years.length > 0) {
          const slider = document.getElementById('yearSlider');
          slider.min = Math.min(...years);
          slider.max = Math.max(...years);
          slider.value = slider.min;
          currentYear = String(slider.min);
          document.getElementById('yearLabel').textContent = currentYear;
        }

        spotsData = spotNames.map(name => {
          const coords = COORDINATES[name] || [22.6273, 120.3014];
          const history = {};

          rawData.forEach(row => {
            const year = String(parseInt(row['年度']));
            const count = parseInt(row[name]) || 0;
            history[year] = count;
          });

          return { name, lat: coords[0], lng: coords[1], history };
        });

        // 建立 地圖圓點 Marker
        spotsData.forEach(spot => {
          const marker = L.circleMarker([spot.lat, spot.lng], {
            radius: UNIFORM_RADIUS
          }).addTo(map);

          marker.on('mouseover', function () { this.setStyle({ weight: 4 }); });
          marker.on('mouseout', function () { this.setStyle({ weight: 2 }); });

          marker.on('click', () => {
            selectSpot(spot);
          });

          markersMap[spot.name] = marker;
        });

        updateUI();
      }
    });

    // 年份切換
    document.getElementById('yearSlider').addEventListener('input', (e) => {
      currentYear = e.target.value;
      document.getElementById('yearLabel').textContent = currentYear;
      updateUI();
    });
  </script>
</body>
</html>
